databaseChangeLog:
  - changeSet:
      id: 2026-09-02-create-table-order
      author: dtuev
      changes:
        - createTable:
            tableName: order
            columns:
              - column:
                  name: id
                  type: UUID
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: source
                  type: UUID
              - column:
                  name: target
                  type: UUID
              - column:
                  name: type
                  type: varchar(50)
              - column:
                  name: status
                  type: varchar(50)
              - column:
                  name: amount
                  type: bigint